<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Bot · Dashboard</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#12171f;
    --line:#232a35;
    --text:#c9d1d9;
    --dim:#6b7684;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, sans-serif;
    --critical:#f0554a;
    --high:#e8973c;
    --medium:#e0c341;
    --low:#4a90a4;
    --accent:#5fd0a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 24px 64px;
  }
  .wrap{max-width:1040px;margin:0 auto;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:28px;
  }
  header h1{
    font-family:var(--mono);
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
    color:#fff;
  }
  header h1 span{color:var(--accent);}
  header .sub{font-family:var(--mono);font-size:12px;color:var(--dim);}

  .stat-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:32px;
  }
  .stat{
    background:var(--panel);
    padding:18px 16px;
  }
  .stat .n{font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;}
  .stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin-top:4px;}
  .stat.critical .n{color:var(--critical);}
  .stat.high .n{color:var(--high);}
  .stat.medium .n{color:var(--medium);}
  .stat.low .n{color:var(--low);}

  .section-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin:0 0 12px 2px;
  }

  table{width:100%;border-collapse:collapse;}
  .pr-table{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .pr-table th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--dim);
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    font-weight:500;
  }
  .pr-table td{
    padding:13px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .pr-table tr:last-child td{border-bottom:none;}
  .pr-table tr:hover td{background:#161c26;}
  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:11.5px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--line);
  }
  .pill.critical{color:var(--critical);border-color:rgba(240,85,74,0.35);}
  .pill.high{color:var(--high);border-color:rgba(232,151,60,0.35);}
  .pill.clean{color:var(--accent);border-color:rgba(95,208,163,0.35);}
  .repo{font-family:var(--mono);color:var(--dim);font-size:12px;}
  .title{color:#fff;}
  .empty{
    padding:48px 20px;
    text-align:center;
    color:var(--dim);
    font-family:var(--mono);
    font-size:13px;
  }
  .badges{display:flex;gap:6px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>review<span>bot</span> · dashboard</h1>
    <div class="sub" id="last-updated">—</div>
  </header>

  <div class="stat-row" id="stat-row">
    <div class="stat"><div class="n" id="s-reviews">–</div><div class="l">PRs reviewed</div></div>
    <div class="stat"><div class="n" id="s-findings">–</div><div class="l">Total findings</div></div>
    <div class="stat critical"><div class="n" id="s-critical">–</div><div class="l">Critical</div></div>
    <div class="stat high"><div class="n" id="s-high">–</div><div class="l">High</div></div>
    <div class="stat medium"><div class="n" id="s-medium">–</div><div class="l">Medium</div></div>
  </div>

  <p class="section-label">Recent pull requests</p>
  <div class="pr-table">
    <table>
      <thead>
        <tr><th>PR</th><th>Repo</th><th>Author</th><th>Files</th><th>Findings</th></tr>
      </thead>
      <tbody id="pr-rows"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none;">No PRs reviewed yet — open a pull request in a connected repo to see it here.</div>
  </div>
</div>

<script>
async function load() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();
    const t = data.totals || {};
    document.getElementById('s-reviews').textContent = t.reviews ?? 0;
    document.getElementById('s-findings').textContent = t.findings ?? 0;
    document.getElementById('s-critical').textContent = t.critical ?? 0;
    document.getElementById('s-high').textContent = t.high ?? 0;
    document.getElementById('s-medium').textContent = t.medium ?? 0;
    document.getElementById('last-updated').textContent = 'updated ' + new Date().toLocaleTimeString();

    const rows = document.getElementById('pr-rows');
    const recent = data.recent || [];
    if (recent.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
    } else {
      rows.innerHTML = recent.map(r => {
        let pill = '<span class="pill clean">clean</span>';
        if (r.critical_count > 0) pill = `<span class="pill critical">● ${r.critical_count} critical</span>`;
        else if (r.high_count > 0) pill = `<span class="pill high">● ${r.high_count} high</span>`;
        return `<tr>
          <td class="title">#${r.pr_number} ${escapeHtml(r.pr_title || '')}</td>
          <td class="repo">${escapeHtml(r.repo)}</td>
          <td>${escapeHtml(r.author || '—')}</td>
          <td>${r.files_reviewed}</td>
          <td class="badges">${pill}<span class="pill">${r.findings_count} total</span></td>
        </tr>`;
      }).join('');
    }
  } catch (e) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('empty-state').textContent = 'Could not reach the API — is the server running?';
  }
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
load();
setInterval(load, 15000);
</script>
</body>
</html>
